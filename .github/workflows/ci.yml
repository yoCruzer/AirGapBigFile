name: Sender validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run protocol, hashing, preparation, scheduler, and UI tests
        run: npm test

      - name: Check browser application syntax
        run: node --check src/app.js

      - name: Rebuild standalone artifact
        run: python3 scripts/build-standalone.py

      - name: Verify standalone artifact
        run: python3 scripts/verify-standalone.py

      - name: Require committed artifact to be current
        run: git diff --exit-code -- AirGapBigFile.standalone.html

      - name: Check patch whitespace
        run: git diff --check
